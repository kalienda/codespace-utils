plugins {
	id 'net.fabricmc.fabric-loom' version "$loom_version"
}

version = "${project.mod_version}+${project.minecraft_version}"

repositories {
	mavenCentral()
	gradlePluginPortal()

	maven { url = uri('https://maven.fabricmc.net/') }
	maven { url = uri('https://maven.shedaniel.me/') }
	maven { url = uri('https://maven.terraformersmc.com/releases/') }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_api_version}"
	implementation "com.terraformersmc:modmenu:${project.mod_menu_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version,
				"loader_version": project.property("loader_version"),
				"minecraft_version": project.property("minecraft_version"),
				"api_version": project.property("fabric_api_version"),
				"cloth_version": project.property("cloth_config_api_version")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}